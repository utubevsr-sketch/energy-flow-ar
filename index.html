<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Flow AR</title>
<style>
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; font-family: system-ui, sans-serif; color: #f4e4c1; }
  canvas { display: block; touch-action: none; }
  #dwarakadhisha { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 14px 28px; font-size: 18px;
           background: #c8922e; color: #1a0f05; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
  #dwarakadhisha:disabled { background: #3a3242; color: #c9bfd6; cursor: default; font-weight: 500; font-size: 15px; }
  #margabandhu { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: 13px;
          background: rgba(20,14,10,.75); border: 1px solid #8a6a32; border-radius: 8px; pointer-events: none; }
  body.leelamaya #dwarakadhisha, body.leelamaya #margabandhu { display: none; }
</style>
</head>
<body>
<button id="dwarakadhisha" disabled>Checking for AR…</button>
<div id="margabandhu">Desktop preview: drag to look around, click a wall or furniture to cast a flow, click the panel to choose.</div>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<!-- Loaded with the time in its address, so a headset never runs an old copy from its cache. -->
<script type="module">import(`./main.js?t=${Date.now()}`);</script>
</body>
</html>
